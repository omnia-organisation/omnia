<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnia · Interactive demo</title>
<meta name="description" content="Omnia is an AI inbox organiser that finds the groups in your email, tidies away the noise and shows what needs you. Try the demo with sample emails.">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Omnia · Interactive demo">
<meta property="og:description" content="Omnia is an AI inbox organiser that finds the groups in your email, tidies away the noise and shows what needs you. Try the demo with sample emails.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Crect width='24' height='24' rx='6' fill='%230A0A0C'/%3E%3Ccircle cx='12' cy='12' r='7' stroke='%23A5B4FF' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%23A5B4FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
html{background:#0A0A0C;color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:#0A0A0C}
button{font-family:inherit}
button:focus-visible{outline:2px solid #A5B4FF;outline-offset:2px}
.row:hover{background:#101013}
.card:hover{border-color:#34343D !important;background:#121216 !important}
.tab:hover{border-color:#3A3A44 !important}
.btn:hover{border-color:#44444F !important}
input::placeholder,textarea::placeholder{color:#8A8A96}
</style>
</head>
<body>
<noscript><p style="margin:0;padding:24px 20px;color:#ECECEF;font-family:system-ui,sans-serif;">Omnia's demo needs JavaScript to run. Please turn it on and reload.</p></noscript>
<div id="app"></div>
<template id="tpl">

<div style="min-height:100vh; background:#0A0A0C; color:#ECECEF; font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;">

  <header style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid #1A1A1F;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="display:flex; color:{{ accent }};">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"></circle><circle cx="12" cy="12" r="3.2" fill="currentColor"></circle></svg>
      </span>
      <span style="font-family:'Space Grotesk','Inter',sans-serif; font-weight:600; font-size:20px; letter-spacing:-0.02em;">omnia</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid #24242A; border-radius:999px; font-size:12.5px; color:#A0A0AB;">
      <span style="width:7px; height:7px; border-radius:50%; background:#62D2C3;"></span>
      <span>Demo · sample emails</span>
    </div>
  </header>

  <main style="max-width:1040px; margin:0 auto; padding:28px 20px 72px; box-sizing:border-box;">

    <sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">
      <div style="font-size:13px; color:#8A8A96; margin-bottom:6px;">Sample inbox · Sunday 8 November</div>
    </sc-if>
    <h1 style="margin:0; font-family:'Space Grotesk','Inter',sans-serif; font-size:32px; line-height:1.15; font-weight:600; letter-spacing:-0.02em;">{{ title }}</h1>
    <p style="margin:6px 0 0; color:#A0A0AB; font-size:14px;">{{ subtitle }}</p>

    <div style="display:flex; gap:12px; align-items:flex-start; margin-top:20px; padding:16px 18px; background:#101013; border:1px solid #1F1F25; border-radius:14px;">
      <span style="display:flex; padding-top:2px; color:{{ accent }};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7L19 16z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
      </span>
      <span style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:12.5px; color:#8A8A96;">Omnia's read</span>
        <span style="font-size:15px; color:#ECECEF; line-height:1.5;">{{ digest }}</span>
      </span>
    </div>

    <nav aria-label="Groups" style="display:flex; gap:8px; overflow-x:auto; margin-top:22px; padding-bottom:6px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="9">
        <button class="tab" onClick="{{ t.pick }}" aria-current="{{ t.current }}" style="flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid {{ t.border }}; background:{{ t.bg }}; color:{{ t.fg }}; font:inherit; font-weight:500; font-size:13.5px; white-space:nowrap; cursor:pointer;">
          <sc-if value="{{ t.hasDot }}" hint-placeholder-val="{{ true }}">
            <span style="width:8px; height:8px; border-radius:50%; background:{{ t.color }};"></span>
          </sc-if>
          <span>{{ t.name }}</span>
          <sc-if value="{{ t.hasCount }}" hint-placeholder-val="{{ true }}">
            <span style="font-weight:400; color:{{ t.countFg }};">{{ t.count }}</span>
          </sc-if>
        </button>
      </sc-for>
      <button class="tab" onClick="{{ openNew }}" aria-current="{{ newCurrent }}" style="flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border-radius:999px; border:1px {{ newBorderStyle }} {{ newBorder }}; background:{{ newBg }}; color:{{ newFg }}; font:inherit; font-weight:500; font-size:13.5px; white-space:nowrap; cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        <span>New group</span>
      </button>
    </nav>

    <sc-if value="{{ hasNotice }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="margin-top:12px; padding:12px 16px; border:1px solid #24242A; border-radius:12px; background:#101013; color:{{ accent }}; font-size:13.5px;">{{ notice }}</div>
    </sc-if>

    <sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">
      <h2 style="margin:28px 0 4px; font-size:13px; font-weight:500; color:#8A8A96;">Groups Omnia found</h2>
      <p style="margin:0 0 12px; font-size:12.5px; color:#8A8A96;">Omnia builds these from your own mail. Rename, merge or tidy any of them.</p>
      <div style="display:flex; flex-wrap:wrap; gap:12px;">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
          <button class="card" onClick="{{ c.pick }}" style="flex:1 1 280px; min-width:0; min-height:112px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between; gap:10px; text-align:left; padding:16px 18px; background:#101013; border:1px solid #1F1F25; border-radius:14px; color:#ECECEF; font:inherit; cursor:pointer;">
            <span style="display:flex; align-items:center; gap:8px; width:100%;">
              <span style="flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:{{ c.color }};"></span>
              <span style="font-weight:600; font-size:15px;">{{ c.name }}</span>
              <span style="margin-left:auto; font-size:12.5px; color:#8A8A96;">{{ c.countLabel }}</span>
            </span>
            <span style="display:block; font-size:13px; color:#A0A0AB;">{{ c.desc }}</span>
            <sc-if value="{{ c.hasFoot }}" hint-placeholder-val="{{ false }}">
              <span style="display:block; font-size:12.5px; color:{{ c.footColor }};">{{ c.foot }}</span>
            </sc-if>
          </button>
        </sc-for>
        <button class="card" onClick="{{ openNew }}" style="flex:1 1 280px; min-width:0; min-height:112px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:6px; text-align:left; padding:16px 18px; background:transparent; border:1px dashed #34343D; border-radius:14px; color:#ECECEF; font:inherit; cursor:pointer;">
          <span style="display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
            <span>Add your own group</span>
          </span>
          <span style="display:block; font-size:13px; color:#A0A0AB;">Name it, and Omnia finds the emails that belong.</span>
        </button>
      </div>

      <sc-if value="{{ hasTidy }}" hint-placeholder-val="{{ true }}">
        <h2 style="margin:32px 0 4px; font-size:13px; font-weight:500; color:#8A8A96;">Tidied away</h2>
        <p style="margin:0 0 12px; font-size:12.5px; color:#8A8A96;">Omnia keeps these out of your way, but still flags anything time-sensitive.</p>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <sc-for list="{{ tidyCards }}" as="c" hint-placeholder-count="3">
            <button class="card" onClick="{{ c.pick }}" style="flex:1 1 280px; min-width:0; box-sizing:border-box; display:flex; flex-direction:column; gap:4px; text-align:left; padding:12px 16px; background:#0D0D10; border:1px solid #1A1A1F; border-radius:12px; color:#ECECEF; font:inherit; cursor:pointer;">
              <span style="display:flex; align-items:center; gap:8px; width:100%;">
                <span style="flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:{{ c.color }};"></span>
                <span style="font-weight:500;">{{ c.name }}</span>
                <span style="margin-left:auto; font-size:12.5px; color:#8A8A96;">{{ c.countLabel }}</span>
              </span>
              <span style="display:block; font-size:12.5px; color:#8A8A96;">{{ c.desc }}</span>
              <sc-if value="{{ c.hasFoot }}" hint-placeholder-val="{{ false }}">
                <span style="display:block; font-size:12.5px; color:{{ c.footColor }};">{{ c.foot }}</span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ isGroupView }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;">
        <button class="btn" onClick="{{ toggleTidy }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid #2B2B33; background:#16161A; color:#ECECEF; font:inherit; font-weight:500; font-size:13.5px; cursor:pointer;">{{ tidyLabel }}</button>
        <button class="btn" onClick="{{ startRename }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid #2B2B33; background:#16161A; color:#ECECEF; font:inherit; font-weight:500; font-size:13.5px; cursor:pointer;">Rename</button>
        <sc-if value="{{ canMerge }}" hint-placeholder-val="{{ true }}">
          <button class="btn" onClick="{{ startMerge }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid #2B2B33; background:#16161A; color:#ECECEF; font:inherit; font-weight:500; font-size:13.5px; cursor:pointer;">Merge into another group</button>
        </sc-if>
      </div>

      <sc-if value="{{ showRename }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px; max-width:520px; padding:16px; border:1px solid #1F1F25; border-radius:14px; background:#101013;">
          <label for="rename-input" style="font-size:13px; font-weight:500;">New name</label>
          <input id="rename-input" type="text" placeholder="{{ renamePlaceholder }}" style="box-sizing:border-box; width:100%; min-height:48px; padding:0 14px; background:#0A0A0C; border:1px solid #2B2B33; border-radius:10px; color:#ECECEF; font:inherit; font-size:15px;">
          <sc-if value="{{ hasPanelError }}" hint-placeholder-val="{{ false }}">
            <div role="alert" style="font-size:13.5px; color:#F2C879;">{{ panelError }}</div>
          </sc-if>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <button onClick="{{ saveRename }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid #ECECEF; background:#ECECEF; color:#0A0A0C; font:inherit; font-weight:600; font-size:14px; cursor:pointer;">Save name</button>
            <button class="btn" onClick="{{ cancelPanel }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid #2B2B33; background:#16161A; color:#ECECEF; font:inherit; font-weight:500; font-size:14px; cursor:pointer;">Cancel</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ showMerge }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px; max-width:640px; padding:16px; border:1px solid #1F1F25; border-radius:14px; background:#101013;">
          <div style="font-size:13px; font-weight:500;">{{ mergeTitle }}</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <sc-for list="{{ mergeOptions }}" as="mo" hint-placeholder-count="4">
              <button class="btn" onClick="{{ mo.pick }}" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border-radius:999px; border:1px solid #2B2B33; background:#16161A; color:#D0D0D8; font:inherit; font-weight:500; font-size:13px; cursor:pointer;">
                <span style="width:8px; height:8px; border-radius:50%; background:{{ mo.color }};"></span>
                <span>{{ mo.name }}</span>
              </button>
            </sc-for>
          </div>
          <div>
            <button class="btn" onClick="{{ cancelPanel }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border-radius:10px; border:1px solid #2B2B33; background:#16161A; color:#ECECEF; font:inherit; font-weight:500; font-size:14px; cursor:pointer;">Cancel</button>
          </div>
        </div>
      </sc-if>

      <p style="margin:12px 0 0; font-size:12.5px; color:#8A8A96;">{{ groupNote }}</p>
    </sc-if>

    <sc-if value="{{ isNewForm }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:20px; margin-top:24px; max-width:640px;">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label for="area-name" style="font-size:13px; font-weight:500;">Group name</label>
          <input id="area-name" type="text" placeholder="e.g. Food, Travel, Money" style="box-sizing:border-box; width:100%; min-height:48px; padding:0 14px; background:#101013; border:1px solid #2B2B33; border-radius:10px; color:#ECECEF; font:inherit; font-size:15px;">
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label for="area-desc" style="font-size:13px; font-weight:500;">What belongs here? <span style="font-weight:400; color:#8A8A96;">Optional</span></label>
          <textarea id="area-desc" rows="3" placeholder="e.g. takeaways, groceries and anything to do with food" style="box-sizing:border-box; width:100%; padding:12px 14px; background:#101013; border:1px solid #2B2B33; border-radius:10px; color:#ECECEF; font:inherit; font-size:15px; line-height:1.5; resize:vertical;"></textarea>
        </div>
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="font-size:13.5px; color:#F2C879;">{{ formError }}</div>
        </sc-if>
        <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
          <span style="font-size:12.5px; color:#8A8A96; margin-right:4px;">Try an example</span>
          <sc-for list="{{ examples }}" as="ex" hint-placeholder-count="3">
            <button class="btn" onClick="{{ ex.pick }}" style="display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border-radius:999px; border:1px solid #2B2B33; background:#16161A; color:#D0D0D8; font:inherit; font-weight:500; font-size:13px; cursor:pointer;">{{ ex.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <button onClick="{{ findMatches }}" style="display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 20px; border-radius:10px; border:1px solid #ECECEF; background:#ECECEF; color:#0A0A0C; font:inherit; font-weight:600; font-size:14px; cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
            <span>Find matching emails</span>
          </button>
        </div>
        <p style="margin:0; font-size:12.5px; color:#8A8A96; line-height:1.6;">In this prototype Omnia matches on keywords. The real version reads each email and judges it with AI.</p>
      </div>
    </sc-if>

    <sc-if value="{{ isNewResults }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:20px; margin-top:24px;">
        <sc-if value="{{ hasMatches }}" hint-placeholder-val="{{ true }}">
          <div style="border-top:1px solid #1C1C21;">
            <sc-for list="{{ matchRows }}" as="m" hint-placeholder-count="3">
              <button class="row" onClick="{{ m.toggle }}" aria-pressed="{{ m.pressed }}" style="width:100%; box-sizing:border-box; display:flex; align-items:flex-start; gap:14px; text-align:left; min-height:44px; padding:14px 16px; background:transparent; border:0; border-bottom:1px solid #1C1C21; color:#ECECEF; font:inherit; cursor:pointer;">
                <span style="flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:22px; height:22px; margin-top:1px; box-sizing:border-box; border-radius:6px; border:1.5px solid {{ m.boxBorder }}; background:{{ m.boxBg }}; color:#0A0A0C;">
                  <sc-if value="{{ m.on }}" hint-placeholder-val="{{ true }}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  </sc-if>
                </span>
                <span style="display:flex; flex-direction:column; gap:4px; min-width:0; flex:1 1 auto;">
                  <span style="font-weight:600;">{{ m.from }}</span>
                  <span style="font-weight:500;">{{ m.subject }}</span>
                  <span style="display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:#8A8A96;">
                    <span style="color:{{ m.strengthColor }};">{{ m.strength }}</span>
                    <span>{{ m.why }}</span>
                    <span>{{ m.currently }}</span>
                  </span>
                </span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noMatches }}" hint-placeholder-val="{{ false }}">
          <div style="padding:20px 16px; border:1px solid #1F1F25; border-radius:14px; background:#101013; color:#A0A0AB;">{{ noMatchText }}</div>
        </sc-if>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <button onClick="{{ createGroup }}" style="display:inline-flex; align-items:center; min-height:48px; padding:0 20px; border-radius:10px; border:1px solid #ECECEF; background:#ECECEF; color:#0A0A0C; font:inherit; font-weight:600; font-size:14px; cursor:pointer;">{{ createLabel }}</button>
          <button class="btn" onClick="{{ backToForm }}" style="display:inline-flex; align-items:center; min-height:48px; padding:0 20px; border-radius:10px; border:1px solid #2B2B33; background:#16161A; color:#ECECEF; font:inherit; font-weight:500; font-size:14px; cursor:pointer;">Start over</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showList }}" hint-placeholder-val="{{ true }}">
    <h2 style="margin:32px 0 10px; font-size:13px; font-weight:500; color:#8A8A96;">{{ listTitle }}</h2>
    <div style="border-bottom:1px solid #1C1C21;">
      <sc-for list="{{ rows }}" as="item" hint-placeholder-count="4">
        <div style="border-top:1px solid #1C1C21;">
          <button class="row" onClick="{{ item.toggle }}" aria-expanded="{{ item.expanded }}" style="width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:6px; text-align:left; min-height:44px; padding:14px 16px; background:transparent; border:0; color:#ECECEF; font:inherit; cursor:pointer;">
            <span style="display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; width:100%;">
              <span style="font-weight:600;">{{ item.from }}</span>
              <sc-if value="{{ item.showAttn }}" hint-placeholder-val="{{ false }}">
                <span style="display:inline-flex; align-items:center; padding:1px 9px; border:1px solid #3A3320; background:#1A160C; color:#F2C879; border-radius:999px; font-size:12px;">Needs you</span>
              </sc-if>
              <span style="margin-left:auto; display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:#8A8A96;">
                <span>{{ item.time }}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:0 0 auto; transform:rotate({{ item.chevRot }}deg);"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
            </span>
            <span style="display:block; font-weight:500; color:{{ item.subjectColor }}; text-decoration:{{ item.deco }};">{{ item.subject }}</span>
            <span style="display:block; font-size:13px; color:{{ item.summaryColor }};">{{ item.summary }}</span>
            <span style="display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; font-size:12px; color:#8A8A96;">
              <sc-if value="{{ item.showGroup }}" hint-placeholder-val="{{ true }}">
                <span style="display:inline-flex; align-items:center; gap:6px;">
                  <span style="width:7px; height:7px; border-radius:50%; background:{{ item.color }};"></span>
                  <span>{{ item.groupName }}</span>
                </span>
              </sc-if>
              <sc-if value="{{ item.hasDue }}" hint-placeholder-val="{{ true }}">
                <span>{{ item.dueLabel }}</span>
              </sc-if>
              <sc-if value="{{ item.showReminder }}" hint-placeholder-val="{{ false }}">
                <span style="color:{{ item.ac }};">Reminder on</span>
              </sc-if>
              <sc-if value="{{ item.showDone }}" hint-placeholder-val="{{ false }}">
                <span>Done</span>
              </sc-if>
            </span>
          </button>

  function cleanMap(src, kind) {
    var out = {};
    if (!src || typeof src !== "object" || Array.isArray(src)) return out;
    Object.keys(src).slice(0, 500).forEach(function (k) {
      var v = src[k];
      if (kind === "bool" && typeof v === "boolean") out[k] = v;
      if (kind === "str" && typeof v === "string" && v.length <= 40) out[k] = v;
    });
    return out;
  }

  function restore() {
    var out = {};
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return out;
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object") return out;
      BOOL_MAPS.forEach(function (k) { out[k] = cleanMap(data[k], "bool"); });

          typeof c.name === "string" && typeof c.color === "string" && /^#[0-9a-fA-F]{3,8}$/.test(c.color);

        return { id: c.id, name: c.name.slice(0, 24), desc: typeof c.desc === "string" ? c.desc.slice(0, 200) : "", color: c.color };
      });
    } catch (e) {
      return {};
    }
    return out;
  }

  function persist(state) {
    try {
      var out = {};
      BOOL_MAPS.concat(STR_MAPS).concat(["custom"]).forEach(function (k) {
        if (state[k] !== undefined) out[k] = state[k];

      // storage blocked: the demo still works, it just forgets on reload
    }
  }

  setMap(key, id, val) {
    const cur = (this.state && this.state[key]) || {};
    this.setState({ [key]: Object.assign({}, cur, { [id]: val }) });
  }

  synonyms() {
    const food = ["pizza", "burger", "grocery", "takeaway", "restaurant", "meal", "voucher"];
    const gaming = ["game", "gaming", "controller", "console", "season", "rewards"];
    const travel = ["train", "rail", "flight", "hotel", "trip", "airport", "holiday", "ticket"];
    const money = ["receipt", "payment", "refund", "invoice", "bill", "price", "discount", "£"];
    const health = ["dental", "dentist", "optician", "eye", "doctor", "medical", "check-up", "surgery"];
    const school = ["module", "coursework", "feedback", "library", "study", "lecture"];
    return {
      food: food, eating: food, takeaway: food, grocery: food,
      gaming: gaming, game: gaming, games: gaming,
      travel: travel, train: travel, holiday: travel, trip: travel,
      money: money, finance: money, bill: money, payment: money, shopping: money,
      health: health, medical: health, dental: health,
      school: school, study: school, uni: school, university: school
    };
  }

  keywordsFor(name, desc) {
    const stop = ["the", "and", "for", "with", "any", "all", "anything", "stuff", "things", "related", "about", "that", "this", "from", "emails", "email", "your", "are", "has", "have", "etc", "like", "such", "also", "other", "just", "some"];
    const raw = (name + " " + desc).toLowerCase().split(/[^a-z0-9£-]+/).filter((w) => w.length > 2 && stop.indexOf(w) === -1);
    const own = [];
    raw.forEach((w) => {
      let stem = w;
      if (w.length > 4 && w.slice(-3) === "ies") stem = w.slice(0, -3) + "y";
      else if (w.length > 4 && w.slice(-1) === "s" && !/(ss|us|is)$/.test(w)) stem = w.slice(0, -1);
      if (own.indexOf(stem) === -1) own.push(stem);
    });
    const syn = this.synonyms();
    const related = [];
    own.forEach((w) => {
      Object.keys(syn).forEach((k) => {
        if (w === k || (w.length > 3 && k.indexOf(w) === 0) || (k.length > 3 && w.indexOf(k) === 0)) {
          syn[k].forEach((s) => { if (related.indexOf(s) === -1) related.push(s); });
        }
      });
    });
    return { own: own, related: related };
  }

  hasWord(text, w) {
    if (w === "£") return text.indexOf("£") !== -1;
    const esc = w.replace(/[^a-z0-9-]/g, "");
    if (!esc) return false;
    const body = esc.length > 3 && esc.slice(-1) === "y" ? esc.slice(0, -1) + "(?:y|ies)" : esc;
    return new RegExp("\\b" + body + (esc.length <= 3 ? "\\b" : "")).test(text);
  }

  scanEmails(name, desc) {
    const kw = this.keywordsFor(name, desc);
    const all = kw.own.concat(kw.related.filter((w) => kw.own.indexOf(w) === -1));
    const out = [];
    this.emailData().forEach((e) => {
      const text = (e.subject + " " + e.summary).toLowerCase();
      const matched = all.filter((w) => this.hasWord(text, w));
      if (matched.length) {
        out.push({ id: e.id, why: "Mentions " + matched.slice(0, 3).join(", "), strong: matched.length >= 2, score: matched.length });
      }
    });
    out.sort((a, b) => b.score - a.score);
    return out;
  }

  readField(id) {
    try {
      const el = document.getElementById(id);
      return el && typeof el.value === "string" ? el.value : "";
    } catch (err) {
      return "";
    }
  }

  fillExample(name, desc) {
    try {
      const a = document.getElementById("area-name");
      const b = document.getElementById("area-desc");
      if (a) a.value = name;
      if (b) b.value = desc;
    } catch (err) {
      // ignore
    }
  }

  goTo(view) {

  }

  nameTaken(name, exceptId) {
    return this.groups().some((g) => g.id !== exceptId && g.name.toLowerCase() === name.toLowerCase());
  }

  findMatches() {
    const name = this.readField("area-name").trim().slice(0, 24);
    const desc = this.readField("area-desc").trim().slice(0, 200);
    if (!name) {
      this.setState({ formError: "Give your group a name first." });
      return;
    }
    if (this.nameTaken(name, "")) {
      this.setState({ formError: "You already have a group called " + name + "." });
      return;
    }
    const found = this.scanEmails(name, desc);
    const picks = {};
    const why = {};
    const strong = {};
    found.forEach((f) => { picks[f.id] = true; why[f.id] = f.why; strong[f.id] = f.strong; });
    this.setState({
      stage: "results",
      formError: "",
      draft: { name: name, desc: desc, ids: found.map((f) => f.id), picks: picks, why: why, strong: strong }
    });
  }

  togglePick(eid) {
    const d = (this.state && this.state.draft) || null;
    if (!d) return;
    this.setState({ draft: Object.assign({}, d, { picks: Object.assign({}, d.picks, { [eid]: !d.picks[eid] }) }) });
  }

  createGroup() {
    const st = this.state || {};
    const d = st.draft;
    if (!d) return;
    const custom = st.custom || [];
    const palette = ["#FF8F8F", "#6FD3EE", "#D9C8A5", "#E59BF0", "#F5A36B"];
    const id = "custom" + (custom.length + 1);
    const area = { id: id, name: d.name, color: palette[custom.length % palette.length], desc: d.desc };
    const moved = Object.assign({}, st.moved || {});
    let n = 0;
    d.ids.forEach((eid) => {
      if (d.picks[eid]) { moved[eid] = id; n += 1; }
    });
    const notice = n > 0
      ? "Created " + d.name + " and filed " + n + (n === 1 ? " email" : " emails") + " in it. Omnia will keep filing new matching emails here."
      : "Created " + d.name + ". Omnia will file matching emails here as they arrive.";
    this.setState({ custom: custom.concat([area]), moved: moved, view: id, stage: "form", draft: null, formError: "", open: null, notice: notice, panel: null });
  }

  toggleTidy(gid, now) {
    this.setMap("tidy", gid, !now);
  }

  startRename() {
    this.setState({ panel: "rename", panelError: "" });
  }

  startMerge() {
    this.setState({ panel: "merge", panelError: "" });
  }

  cancelPanel() {
    this.setState({ panel: null, panelError: "" });
  }

  saveRename(gid) {
    const name = this.readField("rename-input").trim().slice(0, 24);
    if (!name) {
      this.setState({ panelError: "Type a name first." });
      return;
    }
    if (this.nameTaken(name, gid)) {
      this.setState({ panelError: "You already have a group called " + name + "." });
      return;
    }
    const names = Object.assign({}, (this.state && this.state.names) || {}, { [gid]: name });
    this.setState({ names: names, panel: null, panelError: "", notice: "Renamed to " + name + "." });
  }

  mergeInto(fromId, toId, fromName, toName) {
    const merged = Object.assign({}, (this.state && this.state.merged) || {}, { [fromId]: toId });
    this.setState({ merged: merged, view: toId, panel: null, panelError: "", open: null, notice: "Merged " + fromName + " into " + toName + "." });
  }

  resetAll() {
    this.setState({
      view: "overview", open: null, moved: {}, rem: {}, done: {}, tidy: {}, names: {}, merged: {}, custom: [],
      panel: null, panelError: "", notice: "", stage: "form", draft: null, formError: ""
    });
  }

  renderVals() {
    const st = this.state || {};
    const moved = st.moved || {};
    const rem = st.rem || {};
    const done = st.done || {};
    const stage = st.stage || "form";
    const draft = st.draft || null;
    const formError = st.formError || "";
    const notice = st.notice || "";
    const panel = st.panel || null;
    const panelError = st.panelError || "";
    const open = st.open || null;
    const ac = (this.props && this.props.accent) || "#A5B4FF";
    const groups = this.groups();
    const gById = {};
    groups.forEach((g) => { gById[g.id] = g; });
    const special = ["overview", "reminders", "new"];
    let view = st.view || "overview";
    if (special.indexOf(view) === -1 && !gById[view]) view = "overview";
    const isGroupView = special.indexOf(view) === -1;
    const pl = (n, w) => n + " " + w + (n === 1 ? "" : "s");

    const emails = this.emailData().map((e) => Object.assign({}, e, {
      group: this.resolve(moved[e.id] || e.group),
      reminder: Object.prototype.hasOwnProperty.call(rem, e.id) ? rem[e.id] : !!e.due,
      done: !!done[e.id]
    }));
    const groupOf = (e) => gById[e.group] || groups[0];

    const dueKey = (e) => e.due || "9999-12-31";
    const byDue = (a, b) => (dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : 0);
    const doneLast = (a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0);
    const live = (list) => list.filter((e) => !e.done);
    const nextOf = (list) => live(list).filter((e) => e.due).sort(byDue)[0];
    const attnOf = (list) => live(list).filter((e) => e.attention).length;

    const tabDefs = [{ id: "overview", name: "Overview", color: "" }]
      .concat(groups.map((g) => ({ id: g.id, name: g.name, color: g.color })))
      .concat([{ id: "reminders", name: "Reminders", color: "" }]);
    const tabs = tabDefs.map((t) => {
      const sel = view === t.id;
      let count = 0;
      if (t.id === "reminders") count = live(emails.filter((e) => e.reminder)).length;
      else if (t.id !== "overview") count = live(emails.filter((e) => e.group === t.id)).length;
      return {
        id: t.id,
        name: t.name,
        color: t.color,
        hasDot: t.id !== "overview" && t.id !== "reminders",
        hasCount: t.id !== "overview",
        count: count,
        bg: sel ? "#ECECEF" : "transparent",
        fg: sel ? "#0A0A0C" : "#B4B4BE",
        border: sel ? "#ECECEF" : "#26262D",
        countFg: sel ? "#3A3A44" : "#8A8A96",
        current: sel ? "page" : "false",
        pick: () => this.goTo(t.id)
      };
    });
    const newSel = view === "new";

    const makeCard = (g) => {
      const list = emails.filter((e) => e.group === g.id);
      const attn = attnOf(list);
      const nx = nextOf(list);
      let foot = "";
      let footColor = "#8A8A96";
      if (attn > 0) {
        foot = attn + (attn === 1 ? " needs you" : " need you");
        footColor = "#F2C879";
      } else if (nx) {
        foot = "Next: " + nx.action + " · " + nx.dueLabel;
      }
      return {
        id: g.id,
        name: g.name,
        desc: g.desc,
        color: g.color,
        countLabel: pl(live(list).length, "email"),
        hasFoot: foot !== "",
        foot: foot,
        footColor: footColor,
        pick: () => this.goTo(g.id)
      };
    };
    const cards = groups.filter((g) => !g.tidy).map(makeCard);
    const tidyCards = groups.filter((g) => g.tidy).map(makeCard);
    const tidiedCount = live(emails.filter((e) => groupOf(e).tidy)).length;

    let scope = emails;
    let listEmails = [];
    let title = "Your inbox";
    let subtitle = "";
    let listTitle = "";
    let emptyText = "";
    if (view === "overview") {
      scope = emails;
      listEmails = emails.filter((e) => e.attention).sort((a, b) => doneLast(a, b) || byDue(a, b));
      subtitle = pl(emails.length, "email") + " sorted into " + pl(groups.length, "group") + " by Omnia";
      listTitle = "Needs you";
      emptyText = "Nothing needs you right now.";
    } else if (view === "reminders") {
      scope = emails.filter((e) => e.reminder);
      listEmails = scope.slice().sort((a, b) => doneLast(a, b) || byDue(a, b));
      title = "Reminders";
      subtitle = pl(live(scope).length, "reminder") + ", set by Omnia from your emails";
      listTitle = "Coming up";
      emptyText = "No reminders yet. Open an email and tap Set reminder.";
    } else if (view === "new") {
      scope = [];
      listEmails = [];
      title = "New group";
      subtitle = stage === "results" && draft ? "Reviewing matches for " + draft.name : "Name it, and tell Omnia what belongs there";
    } else {
      scope = emails.filter((e) => e.group === view);
      listEmails = scope;
      title = gById[view].name;
      subtitle = pl(live(scope).length, "email") + " · " + gById[view].desc;
      listTitle = "Latest";
      emptyText = "Nothing here yet. Omnia will file matching emails here as they arrive.";
    }

    const attn = attnOf(scope);
    const nx = nextOf(scope);
    let digest = "";
    if (view === "overview") {
      digest = (attn > 0 ? attn + (attn === 1 ? " thing needs" : " things need") + " you." : "Nothing needs you right now.") +
        (nx ? " Next up: " + nx.action + ", " + nx.dueLabel + "." : "") +
        (tidiedCount > 0 ? " " + tidiedCount + (tidiedCount === 1 ? " email is" : " emails are") + " tidied away." : "");
    } else if (view === "new") {
      digest = stage === "results" && draft
        ? "Omnia scanned " + pl(emails.length, "email") + " and found " + draft.ids.length + (draft.ids.length === 1 ? " possible match" : " possible matches") + ". Untick anything that does not belong."
        : "Describe the group in your own words. Omnia will look through your emails and suggest what belongs.";
    } else if (attn > 0) {
      digest = attn + (attn === 1 ? " needs" : " need") + " you." + (nx ? " Next up: " + nx.action + ", " + nx.dueLabel + "." : "");
    } else if (isGroupView && gById[view].tidy) {
      digest = "Tidied away. Nothing in here needs you.";
    } else if (nx) {
      digest = "Nothing urgent. Next up: " + nx.action + ", " + nx.dueLabel + ".";
    } else {
      digest = "You are all caught up here.";
    }

    const picked = draft ? draft.ids.filter((id) => draft.picks[id]).length : 0;
    const matchRows = view === "new" && stage === "results" && draft
      ? draft.ids.map((eid) => {
          const e = emails.find((x) => x.id === eid);
          const on = !!draft.picks[eid];
          const isStrong = !!draft.strong[eid];
          return {
            id: eid,
            from: e.from,
            subject: e.subject,
            why: draft.why[eid],
            strength: isStrong ? "Strong match" : "Possible match",
            strengthColor: isStrong ? ac : "#A0A0AB",
            currently: "Now in " + groupOf(e).name,
            on: on,
            pressed: on ? "true" : "false",
            boxBg: on ? "#ECECEF" : "transparent",
            boxBorder: on ? "#ECECEF" : "#4A4A55",
            toggle: () => this.togglePick(eid)
          };
        })
      : [];

    const examples = [
      { label: "Food", name: "Food & delivery", desc: "pizza, takeaways and groceries" },
      { label: "Gaming", name: "Gaming", desc: "games, controllers and rewards" },
      { label: "Travel", name: "Travel", desc: "trains, flights and hotels" }
    ].map((x) => Object.assign({}, x, { pick: () => this.fillExample(x.name, x.desc) }));

    const cur = isGroupView ? gById[view] : null;
    const mergeOptions = isGroupView
      ? groups.filter((g) => g.id !== view).map((g) => ({
          id: g.id,
          name: g.name,
          color: g.color,
          pick: () => this.mergeInto(view, g.id, cur.name, g.name)
        }))
      : [];

    const rows = listEmails.map((e) => {
      const c = groupOf(e);
      const isOpen = open === e.id;
      return {
        id: e.id,
        from: e.from,
        subject: e.subject,
        summary: e.summary,
        time: e.time,
        body: e.body,
        color: c.color,
        groupName: c.name,
        ac: ac,
        showGroup: view === "overview" || view === "reminders",
        showAttn: e.attention && !e.done,
        hasDue: !!e.due,
        dueLabel: e.dueLabel || "",
        showReminder: e.reminder,
        showDone: e.done,
        open: isOpen,
        expanded: isOpen ? "true" : "false",
        chevRot: isOpen ? 180 : 0,
        subjectColor: e.done ? "#8A8A96" : "#ECECEF",
        summaryColor: e.done ? "#8A8A96" : "#A0A0AB",
        deco: e.done ? "line-through" : "none",
        toggle: () => this.setState({ open: isOpen ? null : e.id }),
        hasAction: !!e.action,
        actionLine: "Suggested next step: " + e.action,
        reminderLabel: e.reminder ? (e.dueLabel ? "Reminder on · " + e.dueLabel : "Reminder on") : "Set reminder",
        remBorder: e.reminder ? ac : "#2B2B33",
        remColor: e.reminder ? ac : "#ECECEF",
        toggleReminder: () => this.setMap("rem", e.id, !e.reminder),
        doneLabel: e.done ? "Done · Undo" : "Mark done",
        doneBg: e.done ? "#ECECEF" : "#16161A",
        doneFg: e.done ? "#0A0A0C" : "#ECECEF",
        doneBorder: e.done ? "#ECECEF" : "#2B2B33",
        toggleDone: () => this.setMap("done", e.id, !e.done),
        filedNote: "Omnia filed this under " + c.name + ". Wrong? Move it:",
        wasMoved: Object.prototype.hasOwnProperty.call(moved, e.id),
        movedNote: "Got it. Omnia will file emails like this under " + c.name + ".",
        moveOptions: groups.map((k) => ({
          id: k.id,
          name: k.name,
          color: k.color,
          bg: e.group === k.id ? "#ECECEF" : "#16161A",
          fg: e.group === k.id ? "#0A0A0C" : "#D0D0D8",
          border: e.group === k.id ? "#ECECEF" : "#2B2B33",
          pick: () => this.setMap("moved", e.id, k.id)
        }))
      };
    });

    return {
      accent: ac,
      isOverview: view === "overview",
      isGroupView: isGroupView,
      title: title,
      subtitle: subtitle,
      digest: digest,
      tabs: tabs,
      cards: cards,
      tidyCards: tidyCards,
      hasTidy: tidyCards.length > 0,
      listTitle: listTitle,
      rows: rows,
      empty: rows.length === 0,
      emptyText: emptyText,
      showList: view !== "new",
      hasNotice: !!notice && view !== "new",
      notice: notice,
      tidyLabel: cur && cur.tidy ? "Bring back" : "Tidy away",
      toggleTidy: () => { if (cur) this.toggleTidy(cur.id, cur.tidy); },
      startRename: () => this.startRename(),
      startMerge: () => this.startMerge(),
      cancelPanel: () => this.cancelPanel(),
      canMerge: groups.length > 1,
      showRename: isGroupView && panel === "rename",
      showMerge: isGroupView && panel === "merge",
      renamePlaceholder: cur ? cur.name : "",
      hasPanelError: !!panelError,
      panelError: panelError,
      saveRename: () => { if (cur) this.saveRename(cur.id); },
      mergeTitle: cur ? "Merge " + cur.name + " into:" : "",
      mergeOptions: mergeOptions,
      groupNote: cur
        ? (cur.tidy
          ? "Tidied away: Omnia keeps this group out of your way, but still flags anything time-sensitive."
          : "Omnia files new emails like this here automatically.")
        : "",
      isNewForm: view === "new" && stage === "form",
      isNewResults: view === "new" && stage === "results" && !!draft,
      hasError: !!formError,
      formError: formError,
      examples: examples,
      hasMatches: matchRows.length > 0,
      noMatches: view === "new" && stage === "results" && !!draft && draft.ids.length === 0,
      noMatchText: "Omnia could not find any emails that match yet. You can still create the group, and new emails that match will be filed there.",
      matchRows: matchRows,
      createLabel: draft ? "Create " + draft.name + (picked > 0 ? " with " + pl(picked, "email") : "") : "Create group",
      newBg: newSel ? "#ECECEF" : "transparent",
      newFg: newSel ? "#0A0A0C" : "#B4B4BE",
      newBorder: newSel ? "#ECECEF" : "#3A3A44",
      newBorderStyle: newSel ? "solid" : "dashed",
      newCurrent: newSel ? "page" : "false",
      openNew: () => this.openNew(),
      findMatches: () => this.findMatches(),
      createGroup: () => this.createGroup(),
      backToForm: () => this.backToForm(),
      resetAll: () => this.resetAll()
    };
  }
}

  // ---- Tiny template engine: turns the markup in <template id="tpl"> into live DOM
  var HOLE = /\{\{\s*([^}]*?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]*?)\s*\}\}\s*$/;
  var FOCUSABLE = { button: 1, input: 1, textarea: 1, select: 1, a: 1 };

  function lookup(path, scope) {
    if (path === "true") return true;
    if (path === "false") return false;
    var parts = path.split(".");
    var cur = scope[parts[0]];
    for (var i = 1; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) {
      var v = lookup(p, scope);
      return v == null || v === false ? "" : String(v);
    });
  }

  function handler(fn) {
    return function () { fn(); };
  }

  function buildChildren(src, scope, dest, key) {
    var kids = src.childNodes;
    for (var i = 0; i < kids.length; i++) buildNode(kids[i], scope, dest, key + "/" + i);
  }

  function buildNode(n, scope, dest, key) {
    if (n.nodeType === 3) {
      dest.appendChild(document.createTextNode(n.nodeValue.indexOf("{{") === -1 ? n.nodeValue : interp(n.nodeValue, scope)));
      return;
    }
    if (n.nodeType !== 1) return;
    var tag = n.localName;
    var m;
    if (tag === "sc-if") {
      m = WHOLE.exec(n.getAttribute("value") || "");
      if (m && lookup(m[1], scope)) buildChildren(n, scope, dest, key);
      return;
    }
    if (tag === "sc-for") {
      m = WHOLE.exec(n.getAttribute("list") || "");
      var list = (m && lookup(m[1], scope)) || [];
      var as = n.getAttribute("as");
      for (var j = 0; j < list.length; j++) {
        var s = Object.create(scope);
        s[as] = list[j];
        s.$index = j;
        var id = list[j] && list[j].id != null ? list[j].id : j;
        buildChildren(n, s, dest, key + ":" + id);
      }
      return;
    }
    var el = document.createElementNS(n.namespaceURI, tag);
    for (var a = 0; a < n.attributes.length; a++) {
      var at = n.attributes[a];
      var name = at.name;
      var val = at.value;
      var w = WHOLE.exec(val);
      if (/^on[a-z]+$/.test(name)) {
        if (w) {
          var fn = lookup(w[1], scope);
          if (typeof fn === "function") el.addEventListener(name.slice(2), handler(fn));
        }
      } else if (w) {
        var v = lookup(w[1], scope);
        if (v != null && v !== false) el.setAttribute(name, String(v));
      } else {
        el.setAttribute(name, val.indexOf("{{") === -1 ? val : interp(val, scope));
      }
    }
    if (FOCUSABLE[tag]) el.setAttribute("data-k", key);
    buildChildren(n, scope, el, key);
    dest.appendChild(el);
  }

  var comp, APP, TPL;

  function render() {
    var vals = comp.renderVals();
    var active = document.activeElement;
    var activeKey = active && active.getAttribute ? active.getAttribute("data-k") : null;
    var sel = null;
    try {
      if (active && typeof active.selectionStart === "number") sel = [active.selectionStart, active.selectionEnd];
    } catch (e) { /* not a text field */ }
    var saved = {};
    APP.querySelectorAll("input[id], textarea[id]").forEach(function (e) { saved[e.id] = e.value; });
    var x = window.pageXOffset;
    var y = window.pageYOffset;

    var frag = document.createDocumentFragment();
    buildChildren(TPL, Object.assign({}, vals), frag, "");
    while (APP.firstChild) APP.removeChild(APP.firstChild);
    APP.appendChild(frag);

    Object.keys(saved).forEach(function (id) {
      var e = document.getElementById(id);
      if (e && saved[id] !== "") e.value = saved[id];
    });
    if (activeKey) {
      var els = APP.querySelectorAll("[data-k]");
      for (var i = 0; i < els.length; i++) {
        if (els[i].getAttribute("data-k") === activeKey) {
          els[i].focus({ preventScroll: true });
          try {
            if (sel && els[i].setSelectionRange) els[i].setSelectionRange(sel[0], sel[1]);
          } catch (e) { /* not a text field */ }
          break;
        }
      }
    }
    window.scrollTo(x, y);
  }

  APP = document.getElementById("app");
  TPL = document.getElementById("tpl").content;
  comp = new Component();
  comp.state = restore();
  render();
})();

</script>
</body>
</html>
